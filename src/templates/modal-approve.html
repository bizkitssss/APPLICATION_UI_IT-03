<div class="modal-dialog" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close" aria-label="Close" ng-click="closeModal()" ng-disabled="isSaving">
                <span aria-hidden="true">&times;</span>
            </button>
            <h4 class="modal-title">IT 03-2 ยืนยันการอนุมัติ</h4>
        </div>

        <div class="modal-body">
            <div class="alert alert-danger" ng-if="modalError">{{modalError}}</div>

            <p class="modal-summary">ต้องการอนุมัติ {{selectedItems.length}} รายการ</p>

            <div class="form-group">
                <label for="approveRemark">รายละเอียด</label>
                <textarea id="approveRemark"
                          class="form-control"
                          rows="4"
                          ng-model="modalForm.reason"
                          ng-disabled="isSaving"
                          placeholder="ระบุรายละเอียดเพิ่มเติม"></textarea>
            </div>
        </div>

        <div class="modal-footer">
            <button type="button" class="btn btn-default" ng-click="closeModal()" ng-disabled="isSaving">ยกเลิก</button>
            <button type="button" class="btn btn-success" ng-click="confirmApprove()" ng-disabled="isSaving">
                <span class="spinner spinner-button" ng-if="isSaving"></span>
                อนุมัติ
            </button>
        </div>
    </div>
</div>
